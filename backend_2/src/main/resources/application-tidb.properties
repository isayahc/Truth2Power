# Truth2Power backend_2 — `tidb` profile (Phase 2)
# Activate with --spring.profiles.active=tidb (and `import` for the one-off job).
# The datasource comes from the environment, never from this file.
# TiDB usernames MUST include the cluster prefix (<prefix>.root); bare `root`
# fails with 1105 "Missing user name prefix".
#
# This file clears the Phase 0 auto-config exclusions from application.properties
# (a profile file wins over application.properties for the same key), so the
# DataSource and Hibernate auto-configuration run under this profile only.
# The default profile keeps booting with no database (file-backed Phase 1 reads).
spring.autoconfigure.exclude=

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Phase 2 read switch: false = file-backed reads (Phase 1 behaviour, the default);
# true = serve /api/hospitals and /api/overview from TiDB. Flip with
# --t2p.reads-from-db=true once the import counts are verified.
t2p.reads-from-db=false
