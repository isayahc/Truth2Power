# Truth2Power backend_2 — Phase 0
# API-only Spring Boot service. Serves /api/* on port 8080; the React app
# (frontend_2) is a separate Vite app and talks to this backend over HTTP.
# Local-only: binds loopback, like the old Node server (repo AGENTS.md rule).
server.port=8080
server.address=127.0.0.1
spring.application.name=truth2power

# Phase 0: no database wired yet. spring-boot-starter-data-jpa and the MySQL
# driver are already dependencies (per the plan), but auto-configuration is
# excluded until Phase 2 wires TiDB. REMOVE these two exclusions when the
# datasource is configured — do not just delete the lines without adding
# SPRING_DATASOURCE_URL / USERNAME / PASSWORD to the environment.
# NOTE: Spring Boot 4 moved auto-config classes out of
# org.springframework.boot.autoconfigure.* into org.springframework.boot.*.autoconfigure
# — the Boot 3 names (…orm.jpa.HibernateJpaAutoConfiguration) do not exist here.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

# Phase 2 (TiDB) — set in the environment, never in this file:
# SPRING_DATASOURCE_URL=jdbc:mysql://<host>:3306/truth2power?sslMode=REQUIRED
# SPRING_DATASOURCE_USERNAME=<prefix>.root
# SPRING_DATASOURCE_PASSWORD=<from TiDB Cloud>
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Activate the tidb profile to use them: --spring.profiles.active=tidb
# (add `import` to run the one-off Wave 1 import job instead of the server).
# See application-tidb.properties.

# Phase 2 read switch (default: file-backed Phase 1 reads). When the TiDB import
# counts are verified, flip with --t2p.reads-from-db=true to serve
# /api/hospitals and /api/overview from the database.
t2p.reads-from-db=false
